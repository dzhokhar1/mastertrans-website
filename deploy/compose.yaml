name: mastertrans

# Сервер общий: рядом живёт стек Remnawave (/opt/subpage). Его Caddy держит
# 80/443, терминирует TLS для site.mastertrans.tk и проксирует на наш caddy
# по сети site_net. Мы не публикуем ни одного порта; у каждого сервиса
# жёсткие лимиты памяти/CPU.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Одноразовый: docker compose run --rm migrate
  migrate:
    image: mastertrans-migrate:${APP_TAG:-latest}
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging: *logging

  app:
    image: mastertrans-app:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, edge]
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:mode=1777
    volumes:
      - app-var:/app/var
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    # Хаб проксирует на контейнер по имени mastertrans-caddy-1 — не переименовывать.
    networks: [edge, site_net]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - db-backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

networks:
  # Внешний мир видит только caddy; база и бэкапы без выхода в интернет.
  edge:
    name: mastertrans_edge
  backend:
    name: mastertrans_backend
    internal: true
  # Создана хабом, общая с Caddy подписки. Не удалять.
  site_net:
    name: site_net
    external: true

volumes:
  db-data:
  app-var:
  caddy-data:
  caddy-config:
  db-backups:
