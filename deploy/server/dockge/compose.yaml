# /opt/dockge/compose.yaml — панель управления стеками.
# Управляет только стеками в /opt/stacks; остальные compose-проекты
# (Remnawave в /opt/subpage) видны лишь со статусом, без кнопок.
# Слушает только localhost: вход через SSH-туннель.
services:
  dockge:
    image: louislam/dockge:1.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /opt/stacks:/opt/stacks
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
