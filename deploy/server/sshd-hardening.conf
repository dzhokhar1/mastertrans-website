# /etc/ssh/sshd_config.d/10-mastertrans.conf
# 00-fleet.conf загружается раньше и уже задаёт вход только по ключу —
# здесь лишь то, чего там нет. MaxAuthTries не трогаем: при многих ключах
# в агенте клиент упрётся в лимит раньше, чем дойдёт до нужного.
X11Forwarding no
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
PermitEmptyPasswords no
